<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舰队复原 · 七下西洋</title>
<meta name="description" content="郑和船只的三维示意复原：船体、硬帆、隔舱与艉舵，以及七次船队数量记载。">
<style>
/*
 * 郑和七下西洋 · 共用样式（设计令牌、页眉导航、按钮、引文、印章标记、表格）
 * 各页面先引入本文件，再引入自己的样式。令牌说明见 docs/SPEC.md §7。
 */
:root {
  /* 纸与墨 */
  --paper: #ecebe1;
  --paper-2: #e3e1d4;
  --ink: #24221d;
  --ink-2: #4a463c;
  --muted: #6e6a5d;
  --rule: #cbc6b4;
  /* 海图 */
  --sea: #cfdcd6;
  --sea-deep: #b9cbc4;
  --land: #e8dfc7;
  --coast: #5f5442;
  --shore: #8fb1a6;
  --grat: #9fb5ad;
  /* 强调 */
  --accent: #24506e;        /* 石青 */
  --accent-soft: #d5e0e4;
  --seal: #b23a2b;          /* 朱砂 */
  --seal-ink: #fbf5ec;
  --focus: #24506e;
  /* 七次航程 */
  --v1: #b8402f; --v2: #b0701a; --v3: #2f7d52; --v4: #1f5a96;
  --v5: #73479a; --v6: #13777a; --v7: #8a2f55;
  --ghost: #8e968d;
  /* 约 1415 年诸国着色（0 为明朝） */
  --pc0: #f0cf6a; --pc1: #e7b8a4; --pc2: #b9d4a6; --pc3: #a9c7dd; --pc4: #cdb7dc;
  --pc5: #edc8a0; --pc6: #a6d1c8; --pc7: #e4bfcf; --pc8: #cfd09c;
  --rel-ming: #f0cf6a; --rel-visit: #8fc7a3; --rel-loose: #e9bf8e; --rel-tribute: #a9c4de; --rel-other: #dcd6c8;
  --pol-border: #7d6f58;
  /* 图表（已用 dataviz 校验脚本验证：明暗两套均通过） */
  --chart-1: #1d67ad; --chart-2: #b06a12; --chart-3: #2f8f68; --chart-muted: #b4bfc4; --chart-grid: #d8d4c6;
  /* 字体 */
  --f-display: "Ma Shan Zheng", "STXingkai", "Xingkai SC", "STKaiti", "Kaiti SC", "KaiTi", serif;
  --f-body: "Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN", "Songti SC", "STSong", "SimSun", serif;
  --f-ui: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  /* 字号 */
  --t-xs: 0.75rem; --t-sm: 0.8125rem; --t-base: 0.9375rem; --t-md: 1.0625rem;
  --t-lg: 1.3125rem; --t-xl: 1.75rem; --t-2xl: 2.5rem;
  --panel-w: 440px;
  --shadow: 0 1px 2px rgb(36 34 29 / 0.12), 0 6px 18px rgb(36 34 29 / 0.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a1e; --paper-2: #1a2329; --ink: #e9e4d6; --ink-2: #cfc9b9; --muted: #9c9786; --rule: #2d393e;
    --sea: #0f1c23; --sea-deep: #0b161c; --land: #313c35; --coast: #a69a7c; --shore: #24443f; --grat: #23363b;
    --accent: #8fbdd8; --accent-soft: #1d3240; --seal: #e0644f; --seal-ink: #1a0f0c; --focus: #8fbdd8;
    --v1: #f07d68; --v2: #e8a64e; --v3: #62c98f; --v4: #74a9ea; --v5: #bb92e6; --v6: #4cc7c4; --v7: #e57aa6;
    --ghost: #56625f;
    --pc0: #7c6624; --pc1: #6c463a; --pc2: #4b6342; --pc3: #3d5a70; --pc4: #594a70;
    --pc5: #6c5336; --pc6: #355f59; --pc7: #684556; --pc8: #5b5c37;
    --rel-ming: #7c6624; --rel-visit: #3f6e55; --rel-loose: #775634; --rel-tribute: #3d5a74; --rel-other: #394039;
    --pol-border: #a69a7c;
    --chart-1: #3b87d4; --chart-2: #c47b1c; --chart-3: #2f9a72; --chart-muted: #3e4b52; --chart-grid: #26323a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 22px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a1e; --paper-2: #1a2329; --ink: #e9e4d6; --ink-2: #cfc9b9; --muted: #9c9786; --rule: #2d393e;
  --sea: #0f1c23; --sea-deep: #0b161c; --land: #313c35; --coast: #a69a7c; --shore: #24443f; --grat: #23363b;
  --accent: #8fbdd8; --accent-soft: #1d3240; --seal: #e0644f; --seal-ink: #1a0f0c; --focus: #8fbdd8;
  --v1: #f07d68; --v2: #e8a64e; --v3: #62c98f; --v4: #74a9ea; --v5: #bb92e6; --v6: #4cc7c4; --v7: #e57aa6;
  --ghost: #56625f;
  --pc0: #7c6624; --pc1: #6c463a; --pc2: #4b6342; --pc3: #3d5a70; --pc4: #594a70;
  --pc5: #6c5336; --pc6: #355f59; --pc7: #684556; --pc8: #5b5c37;
  --rel-ming: #7c6624; --rel-visit: #3f6e55; --rel-loose: #775634; --rel-tribute: #3d5a74; --rel-other: #394039;
  --pol-border: #a69a7c;
  --chart-1: #3b87d4; --chart-2: #c47b1c; --chart-3: #2f9a72; --chart-muted: #3e4b52; --chart-grid: #26323a;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 22px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-base);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 页眉 ---------- */
.masthead {
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  position: relative;
  z-index: 5;
}
.seal {
  flex: none;
  width: 44px; height: 44px;
  background: var(--seal);
  color: var(--seal-ink);
  border-radius: 3px;
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 1.15rem;
  line-height: 1;
  writing-mode: vertical-rl;
  letter-spacing: 0.08em;
  box-shadow: inset 0 0 0 2px var(--seal), inset 0 0 0 3.5px var(--seal-ink);
}
.title-block { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.title-block h1 {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: var(--t-xl);
  line-height: 1.1;
  letter-spacing: 0.06em;
}
.title-block .sub { color: var(--muted); font-size: var(--t-sm); font-family: var(--f-ui); }
.mast-actions { display: flex; gap: 8px; align-items: center; }
.btn-quiet {
  border: 1px solid var(--rule);
  background: transparent;
  border-radius: 999px;
  padding: 4px 12px;
  font-family: var(--f-ui);
  font-size: var(--t-sm);
  cursor: pointer;
  color: var(--ink-2);
}
.btn-quiet:hover { background: var(--paper-2); }

/* 栏目导航（js/nav.js 生成） */
.site-nav { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.site-nav::-webkit-scrollbar { display: none; }
.site-nav a {
  flex: none; padding: 6px 10px; color: var(--ink-2); text-decoration: none; white-space: nowrap;
  font-size: var(--t-sm); letter-spacing: 0.06em; border-radius: 4px;
}
.site-nav a:hover { background: var(--paper-2); color: var(--ink); }
.site-nav a[aria-current="page"] { color: var(--ink); font-weight: 700; border-radius: 0; box-shadow: inset 0 -2px 0 var(--accent); }
@media (max-width: 760px) {
  .masthead { flex-wrap: wrap; row-gap: 4px; }
  .site-nav { order: 3; width: 100%; margin-inline: -10px; }
}

/* ---------- 共用排版与组件 ---------- */
.lede { font-size: var(--t-md); line-height: 1.8; }
.note { color: var(--muted); font-size: var(--t-sm); }
.kicker { font-family: var(--f-ui); font-size: var(--t-xs); letter-spacing: 0.12em; color: var(--muted); }
.btn-play {
  --vc: var(--accent);
  border: 0;
  background: var(--vc);
  color: var(--paper);
  border-radius: 4px;
  padding: 8px 16px 8px 12px;
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer;
  font-size: var(--t-base);
  letter-spacing: 0.06em;
}
.btn-play svg { width: 16px; height: 16px; fill: currentColor; }
.btn-play:hover { filter: brightness(1.08); }
.btn-line {
  border: 1px solid var(--rule); background: transparent; border-radius: 4px; padding: 7px 12px; cursor: pointer; font-size: var(--t-sm);
}
.btn-line:hover { background: var(--paper-2); }
a.btn-line { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; }

/* 史料引文 */
.source {
  margin: 0;
  padding: 12px 14px 12px 16px;
  background: var(--paper-2);
  border-left: 3px solid var(--accent);
  font-size: var(--t-sm);
  line-height: 1.85;
}
.source cite { display: block; margin-top: 6px; font-style: normal; font-family: var(--f-ui); font-size: var(--t-xs); color: var(--muted); }
.source cite::before { content: "—— "; }

/* 印章式小标记（大事类型） */
.glyph {
  display: inline-grid; place-items: center;
  width: 24px; height: 24px;
  border: 1.5px solid var(--ink-2);
  border-radius: 3px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 700;
  font-style: normal;
  font-size: 13px;
  line-height: 1;
}
.glyph.g-战 { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.glyph.g-卒 { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.glyph.g-碑 { border-color: var(--accent); color: var(--accent); }
.glyph.g-贡 { border-color: var(--v2); color: var(--v2); }

.prose { display: flex; flex-direction: column; gap: 10px; }
.kv { margin: 0; display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 4px 12px; font-size: var(--t-sm); }
.kv dt { color: var(--muted); font-family: var(--f-ui); font-size: var(--t-xs); padding-top: 2px; }
.kv dd { margin: 0; }
.table-wrap { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { font-family: var(--f-ui); font-size: var(--t-xs); color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figcaption { font-size: var(--t-xs); color: var(--muted); font-family: var(--f-ui); }
.refs { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; font-size: var(--t-sm); }
.refs li::marker { color: var(--muted); }
.refs b { font-weight: 700; }
.credits { font-size: var(--t-xs); color: var(--muted); font-family: var(--f-ui); border-top: 1px solid var(--rule); padding-top: 12px; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>

<script>
/*
 * 共用页眉：栏目导航与昼夜切换。各页面在 <body data-page="…"> 上写本页 id，
 * 页眉里放 <div class="mast-actions"><button id="theme-toggle">…</button></div>，其余由本脚本生成。
 * 切换昼夜时在 window 上派发 'zh:theme' 事件（detail.dark 为布尔值），供需要重绘的页面监听。
 */
(function () {
  'use strict';
  // ready: false 的页面尚未完成，不出现在导航中（完成一个就改一个，见 docs/ROADMAP.md）
  var PAGES = [
    { id: 'map', href: 'index.html', name: '航海图' },
    { id: 'world', href: 'world.html', name: '天下全图', ready: false },
    { id: 'voyages', href: 'voyages.html', name: '航次档案' },
    { id: 'fleet', href: 'fleet.html', name: '舰队复原' },
    { id: 'people', href: 'people.html', name: '人物复原', ready: false }
  ];
  var root = document.documentElement;

  function store(k, v) {
    try {
      if (v === undefined) return window.localStorage.getItem('zh:' + k);
      window.localStorage.setItem('zh:' + k, v);
    } catch (e) { return null; }
  }
  // 尽早应用保存的配色，避免闪烁
  var saved = store('theme');
  if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);

  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  function mount() {
    var head = document.querySelector('.masthead');
    if (!head) return;
    var current = document.body.getAttribute('data-page');
    var pages = PAGES.filter(function (p) { return p.ready !== false || p.id === current; });
    if (pages.length > 1) {
      var nav = document.createElement('nav');
      nav.className = 'site-nav';
      nav.setAttribute('aria-label', '栏目');
      nav.innerHTML = pages.map(function (p) {
        return '<a href="' + p.href + '"' + (p.id === current ? ' aria-current="page"' : '') + '>' + p.name + '</a>';
      }).join('');
      head.insertBefore(nav, head.querySelector('.mast-actions'));
    }
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var sync = function () { btn.textContent = isDark() ? '昼航' : '夜航'; };
    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      store('theme', next);
      sync();
      window.dispatchEvent(new CustomEvent('zh:theme', { detail: { dark: next === 'dark' } }));
    });
    sync();
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', function () {
        sync();
        window.dispatchEvent(new CustomEvent('zh:theme', { detail: { dark: isDark() } }));
      });
    }
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  }

  window.ZHNav = { pages: PAGES, isDark: isDark, store: store };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

</script>
